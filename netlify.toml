# Studio site root — never nest client/concept folders as publish.
[build]
  publish = "."

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.{css,js,ico,png,jpg,webp,svg}"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
